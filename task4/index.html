<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Быки и коровы</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <h1>Быки и коровы</h1>

      <div class="guess-form">
        <input type="text" id="guess-input" placeholder="4 разные цифры" />
        <button id="check-button">Проверить</button>
      </div>

      <p id="message"></p>
      <p id="attempts"></p>

      <ul id="history"></ul>

      <button id="new-game-button">Новая игра</button>
    </div>
  </body>
</html>
