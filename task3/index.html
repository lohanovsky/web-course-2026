<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-list</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <h1>Список задач</h1>

      <div class="add-form">
        <input type="text" id="task-input" placeholder="Новая задача" />
        <button id="add-button">Добавить</button>
      </div>

      <div class="filters">
        <button class="filter active" data-filter="all">Все</button>
        <button class="filter" data-filter="active">Активные</button>
        <button class="filter" data-filter="completed">Завершённые</button>
      </div>

      <ul id="task-list"></ul>

      <p id="counter"></p>
    </div>
  </body>
</html>
