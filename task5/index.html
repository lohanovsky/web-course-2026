<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <h1>Simon</h1>

      <p id="level">Уровень: 0</p>
      <p id="message">Нажмите «Старт»</p>

      <div class="board">
        <button class="pad green" data-index="0"></button>
        <button class="pad red" data-index="1"></button>
        <button class="pad yellow" data-index="2"></button>
        <button class="pad blue" data-index="3"></button>
      </div>

      <button id="start-button">Старт</button>
    </div>
  </body>
</html>
